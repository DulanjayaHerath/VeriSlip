version: '3.8'

services:
  verislip-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: verislip:latest
    container_name: verislip-api
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - VERISLIP_API_KEY_HASHES=${VERISLIP_API_KEY_HASHES}
      - VERISLIP_ENV=production
      - VERISLIP_JOB_WORKERS=${VERISLIP_JOB_WORKERS:-2}
      - VERISLIP_JOB_MAX_RECORDS=${VERISLIP_JOB_MAX_RECORDS:-1000}
      - VERISLIP_JOB_RETENTION_SECONDS=${VERISLIP_JOB_RETENTION_SECONDS:-3600}
      - VERISLIP_WHATSAPP_ACCESS_TOKEN=${VERISLIP_WHATSAPP_ACCESS_TOKEN:-}
      - VERISLIP_WHATSAPP_GRAPH_API_VERSION=${VERISLIP_WHATSAPP_GRAPH_API_VERSION:-v21.0}
      - VERISLIP_WHATSAPP_SESSION_TTL_SECONDS=${VERISLIP_WHATSAPP_SESSION_TTL_SECONDS:-2592000}
      - VERISLIP_WHATSAPP_IDEMPOTENCY_TTL_SECONDS=${VERISLIP_WHATSAPP_IDEMPOTENCY_TTL_SECONDS:-86400}
      - VERISLIP_WHATSAPP_STATE_MAX_RECORDS=${VERISLIP_WHATSAPP_STATE_MAX_RECORDS:-10000}
      - VERISLIP_WHATSAPP_DEFAULT_TIER=${VERISLIP_WHATSAPP_DEFAULT_TIER:-free}
      - VERISLIP_WHATSAPP_FREE_VERIFICATIONS=${VERISLIP_WHATSAPP_FREE_VERIFICATIONS:-5}
      - VERISLIP_WHATSAPP_UPGRADE_URL=${VERISLIP_WHATSAPP_UPGRADE_URL:-}
      - VERISLIP_SMS_ENABLED=${VERISLIP_SMS_ENABLED:-0}
      - VERISLIP_SMS_GATEWAY_URL=${VERISLIP_SMS_GATEWAY_URL:-}
      - VERISLIP_SMS_APPLICATION_ID=${VERISLIP_SMS_APPLICATION_ID:-}
      - VERISLIP_SMS_PASSWORD=${VERISLIP_SMS_PASSWORD:-}
      - VERISLIP_SMS_SENDER_ID=${VERISLIP_SMS_SENDER_ID:-VeriSlip}
      - VERISLIP_SMS_CONNECT_TIMEOUT_SECONDS=${VERISLIP_SMS_CONNECT_TIMEOUT_SECONDS:-5}
      - VERISLIP_SMS_READ_TIMEOUT_SECONDS=${VERISLIP_SMS_READ_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - verislip-network

  redis:
    image: redis:7-alpine
    container_name: verislip-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - verislip-network

  nginx:
    image: nginx:alpine
    container_name: verislip-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - verislip-api
    networks:
      - verislip-network

volumes:
  redis-data:
    driver: local

networks:
  verislip-network:
    driver: bridge
