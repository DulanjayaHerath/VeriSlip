[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verislip"
version = "1.0.0"
description = "Multi-Layer Digital Bank Transfer Slip Forensic Verification Engine"
authors = [{ name = "VeriSlip Team" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | verislip_dataset
  | weights
  | scratch
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = ["verislip_dataset", "weights", ".git", ".pytest_cache", "scratch"]
